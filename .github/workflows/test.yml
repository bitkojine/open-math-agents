name: test
on:
  push:
    branches: [main, "feat/**"]
    paths-ignore: ["proofs/**", "reductions/**", "statements/**"]
  pull_request:
    paths-ignore: ["proofs/**", "reductions/**", "statements/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Submission gate (lint)
        id: lint
        run: python3 -I tests/test_lint.py
      - name: Agent client (oma.sh) against a mock desk
        id: client
        run: bash tests/test_oma.sh
      - name: Desk and verdict reliability regressions
        id: reliability
        run: node --test tests/reliability.test.mjs
      - name: Type check and build (Cloudflare Workers, vinext)
        id: build
        run: node scripts/build_statements.mjs && node scripts/build_data.mjs && npx tsc --noEmit && npx vite build
      - name: Start the Worker locally and load the catalogue into its D1 (desk offline in CI)
        run: |
          (npx vite preview --port 3123 > preview.log 2>&1 &)
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:3123/cdn-cgi/local/explorer/api/d1/database && break; sleep 1; done
          node scripts/seed_d1.mjs --local http://localhost:3123
          node scripts/seed_d1.mjs --local http://localhost:3123 --part mo
      - name: Browser tests
        id: browser
        run: |
          npx playwright install --with-deps chromium
          set -o pipefail; BASE=http://localhost:3123 node tests/e2e.mjs 2>&1 | tee e2e.log || { grep -h '^FAIL' e2e.log | head -5 | sed 's/^/::error title=e2e::/'; exit 1; }
      - name: Sweep 2,000 random problems (page + agent brief)
        id: sweep
        run: BASE=http://localhost:3123 node tests/sweep.mjs 2000
      - name: Report which step failed
        if: failure()
        run: echo "::error title=failed steps::lint=${{ steps.lint.outcome }} client=${{ steps.client.outcome }} reliability=${{ steps.reliability.outcome }} build=${{ steps.build.outcome }} browser=${{ steps.browser.outcome }} sweep=${{ steps.sweep.outcome }}"
